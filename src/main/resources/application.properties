spring.application.name=wishlist

# ===== Conexión a PostgreSQL (en WSL) =====
spring.datasource.url=jdbc:postgresql://localhost:5432/carvajal_wishlist
spring.datasource.username=carvajal
spring.datasource.password=carvajal123
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
# validate = Hibernate revisa que las entidades coincidan con las tablas,
# pero NO modifica la BD (tú ya la creaste a mano).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

# ===== JWT =====
# ClaveBase64 para firmar tokens (HS256). En producción, usar variable de entorno.
jwt.secret=Q2FydmFqYWxFY29tZXJzU2VjcmV0S2V5MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY=
jwt.expiration-ms=86400000

# ===== Cloudinary =====
# Secretos SOLO por variables de entorno; nunca hardcodearlos en el repo.
# En local se definen en la terminal; en Render, en las env vars del servicio.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ===== Upload multipart (POST /api/products/{id}/image) =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB