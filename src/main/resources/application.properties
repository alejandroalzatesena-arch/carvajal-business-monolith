spring.application.name=wishlist

# ===== Conexión a PostgreSQL (en WSL) =====
spring.datasource.url=jdbc:postgresql://localhost:5432/carvajal_wishlist
spring.datasource.username=carvajal
spring.datasource.password=carvajal123
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
# validate = Hibernate revisa que las entidades coincidan con las tablas,
# pero NO modifica la BD (tú ya la creaste a mano).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

