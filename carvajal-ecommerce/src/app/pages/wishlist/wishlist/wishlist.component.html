<section class="wishlist">

    <div class="container">

        <h1>

            ❤️ Mi Lista de Deseos

        </h1>

        <p *ngIf="wishlist.length==0" class="empty">

            No tienes productos agregados.

        </p>

        <div class="row">

            <div
                class="col-lg-4 col-md-6"
                *ngFor="let product of wishlist; let i=index">

                <mat-card>

                    <img
                        mat-card-image
                        [src]="product.image">

                    <mat-card-content>

                        <h4>

                            {{product.name}}

                        </h4>

                        <h3>

                            {{product.price}}

                        </h3>

                    </mat-card-content>

                    <mat-card-actions>

                        <button
                            mat-raised-button
                            color="primary">

                            Agregar al carrito

                        </button>

                        <button
                            mat-icon-button
                            color="warn"
                            (click)="remove(i)">

                            <mat-icon>

                                Eliminar

                            </mat-icon>

                        </button>

                    </mat-card-actions>

                </mat-card>

            </div>

        </div>

    </div>

</section>
