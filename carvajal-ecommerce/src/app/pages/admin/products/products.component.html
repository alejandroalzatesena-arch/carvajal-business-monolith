<div class="products">

    <div class="header">

        <h1>

            Administración de Productos

        </h1>

        <button
            mat-raised-button
            color="primary"
            routerLink="/admin/create-product">

            <mat-icon>

                add

            </mat-icon>

            Nuevo Producto

        </button>

    </div>

    <div class="search">

        <mat-form-field appearance="outline">

            <mat-label>

                Buscar producto

            </mat-label>

            <input
                matInput
                [(ngModel)]="search">

        </mat-form-field>

    </div>

    <table class="table table-hover align-middle">

        <thead>

            <tr>

                <th>Imagen</th>
                <th>Producto</th>
                <th>Categoría</th>
                <th>Marca</th>
                <th>Stock</th>
                <th>Precio</th>
                <th>Acciones</th>

            </tr>

        </thead>

        <tbody>

            <tr *ngFor="let product of products">

                <td>

                    <img
                        [src]="product.image">

                </td>

                <td>

                    {{product.name}}

                </td>

                <td>

                    {{product.category}}

                </td>

                <td>

                    {{product.brand}}

                </td>

                <td>

                    <span
                        class="badge bg-success">

                        {{product.stock}}

                    </span>

                </td>

                <td>

                    <strong>

                        {{product.price}}

                    </strong>

                </td>

                <td>

                    <button
                        mat-icon-button
                        color="primary">

                        <mat-icon>

                            edit

                        </mat-icon>

                    </button>

                    <button
                        mat-icon-button
                        color="warn">

                        <mat-icon>

                            Eliminar

                        </mat-icon>

                    </button>

                </td>

            </tr>

        </tbody>

    </table>

</div>
