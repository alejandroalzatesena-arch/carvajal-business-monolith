<div class="dashboard">

    <h1>

        Panel Administrativo

    </h1>

    <div class="row">

        <div
            class="col-lg-3 col-md-6"
            *ngFor="let item of stats">

            <div
                class="stat-card"
                [style.background]="item.color">

                <mat-icon>

                    {{item.icon}}

                </mat-icon>

                <h2>

                    {{item.value}}

                </h2>

                <p>

                    {{item.title}}

                </p>

            </div>

        </div>

    </div>

    <div class="welcome">

        <h2>

            Bienvenido Administrador

        </h2>

        <p>

            Desde este panel podrás administrar los productos,
            usuarios e historial del e-commerce.

        </p>

    </div>

</div>
