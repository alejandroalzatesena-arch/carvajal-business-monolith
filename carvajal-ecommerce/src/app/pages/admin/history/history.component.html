<div class="history">

    <h1>

        Historial de Actividad

    </h1>

    <div
        class="history-card"
        *ngFor="let item of history">

        <div class="icon">

            <mat-icon [color]="item.color">

                {{item.icon}}

            </mat-icon>

        </div>

        <div class="content">

            <h3>

                {{item.action}}

            </h3>

            <p>

                {{item.description}}

            </p>

            <small>

                {{item.user}} • {{item.date}}

            </small>

        </div>

    </div>

</div>
