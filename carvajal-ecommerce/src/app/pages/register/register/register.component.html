<div class="register-page">
  <div class="register-card">
    <div class="register-image">
      <img src="assets/images/register.png">
    </div>
    <div class="register-form">
      <h1>Crear Cuenta</h1>
      <p>Regístrate para comenzar a comprar.</p>

      <mat-form-field appearance="outline">
        <mat-label>Nombre completo</mat-label>
        <input matInput [(ngModel)]="fullName">
        <mat-icon matSuffix>person</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Correo</mat-label>
        <input matInput [(ngModel)]="email" type="email">
        <mat-icon matSuffix>email</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Contraseña</mat-label>
        <input matInput [type]="hidePassword ? 'password':'text'" [(ngModel)]="password">
        <button mat-icon-button matSuffix (click)="hidePassword=!hidePassword">
          <mat-icon>{{hidePassword ? 'visibility':'visibility_off'}}</mat-icon>
        </button>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Confirmar contraseña</mat-label>
        <input matInput [type]="hideConfirm ? 'password':'text'" [(ngModel)]="confirmPassword">
        <button mat-icon-button matSuffix (click)="hideConfirm=!hideConfirm">
          <mat-icon>{{hideConfirm ? 'visibility':'visibility_off'}}</mat-icon>
        </button>
      </mat-form-field>

      <button mat-raised-button color="primary" class="register-button" (click)="register()" [disabled]="loading">
        {{ loading ? 'Registrando...' : 'Registrarme' }}
      </button>

      <div class="login-link">
        ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
      </div>
    </div>
  </div>
</div>
